<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 — страница не найдена</title>
    <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
    <link rel="stylesheet" href="app/css/styles/pages/error.css?v=20260422-0500">
  </head>
  <body>
    <main class="error-page">
      <section class="error-shell" aria-labelledby="error-title">
        <div class="error-copy">
          <p class="error-kicker">Страница не найдена</p>
          <p class="error-code">404</p>
          <h1 class="error-title" id="error-title">Такой комнаты здесь нет</h1>
          <p class="error-text">Адрес мог измениться или раздел ещё не собран. Вернитесь на главную и выберите нужный сценарий мебели.</p>
          <div class="error-actions">
            <a class="error-button" href="index.html">На главную</a>
          </div>
          <p class="error-footnote">Мебельное ателье · кухни, шкафы и гардеробные на заказ</p>
        </div>
        <div class="error-visual-wrap" aria-hidden="true">
          <span class="error-orbit error-orbit-one"></span>
          <span class="error-orbit error-orbit-two"></span>
          <span class="error-orbit error-orbit-three"></span>
          <span class="error-accent error-accent-shelf"></span>
          <span class="error-accent error-accent-dot"></span>
          <img class="error-visual" src="assets/illustrations/error-room.svg" alt="">
        </div>
      </section>
    </main>
  </body>
</html>
