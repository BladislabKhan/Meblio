<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в ЛК</title>
    <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
    <link rel="stylesheet" href="app/css/admin.css?v=20260423-0500">
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-container" id="auth-container">
        <div class="auth-card auth-card-minimal">
          <h1 class="auth-title auth-title-minimal">Вход в ЛК</h1>

          <form id="login-form" class="stack">
            <label class="field">
              <span>Логин</span>
              <input type="text" name="login" autocomplete="username" required>
            </label>
            <label class="field">
              <span>Пароль</span>
              <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button type="submit" class="button button-primary">Войти</button>
          </form>
          <p class="auth-feedback" id="auth-feedback"></p>
        </div>
      </section>
    </main>

    <script src="app/js/site-config.js?v=20260423-0500"></script>
    <script src="app/js/admin-login.js?v=20260423-0500"></script>
  </body>
</html>
